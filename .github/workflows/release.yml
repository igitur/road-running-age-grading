name: release

# A tag starting with v is the whole release procedure. The version is not in
# any file: setuptools-scm derives it from the tag, so `git tag v0.0.2` publishes
# 0.0.2 and an untagged commit cannot ship by accident.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note. A dispatch builds and tests but publishes nothing (no tag)."
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and test the distribution
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm needs the tags, so a shallow clone is not enough.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: The sdist must carry sources, not our build outputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import tarfile, sys, glob
          sdist = glob.glob("dist/*.tar.gz")[0]
          with tarfile.open(sdist) as t:
              names = t.getnames()
          junk = [n for n in names if n.endswith((".xll", ".zip", ".whl", ".o"))]
          if junk:
              sys.exit(f"{sdist} contains build outputs: {junk[:5]}")
          print(f"  {sdist}: {len(names)} entries, no binaries")
          PY

      - name: The version must be the tag
        id: version
        run: |
          set -euo pipefail
          built=$(ls dist/*.whl | sed -E 's|^dist/brrag-([^-]+)-.*$|\1|')
          echo "built $built"
          echo "version=$built" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$built" != "$tag" ]; then
              echo "::error::tag is $GITHUB_REF_NAME but the build is $built - bump or move the tag"
              exit 1
            fi
          else
            echo "::notice::not a tag, so nothing will be published (version $built)"
          fi

      - name: The wheel must carry its own tables
        run: |
          set -euo pipefail
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --quiet --disable-pip-version-check dist/*.whl
          # Run from outside the checkout: brrag must not fall back to ../data.
          cd /tmp
          /tmp/wheeltest/bin/python "$GITHUB_WORKSPACE/tools/wheel_smoke.py" "${{ steps.version.outputs.version }}"

      - name: Install the mingw cross-compiler
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends g++-mingw-w64-x86-64

      - name: Check out the xll framework this build is pinned to
        run: |
          set -euo pipefail
          # Pinned to the commit xll/patches/xll-mingw-portability.patch applies to:
          # a moving upstream would silently change the .xll we ship.
          XLL_DIR="$HOME/code/xll"
          mkdir -p "$XLL_DIR"
          git -C "$XLL_DIR" init -q
          git -C "$XLL_DIR" remote add origin https://github.com/xlladdins/xll
          git -C "$XLL_DIR" fetch -q --depth 1 origin 481178bced1022f0b36b582388b79a6eabe1a11f
          git -C "$XLL_DIR" checkout -q FETCH_HEAD
          git -C "$XLL_DIR" rev-parse --short HEAD
          ./xll/tools/apply-xll-patches.sh

      - name: Build the add-in and audit its exports
        run: |
          set -euo pipefail
          make -C xll shim
          make -C xll xll verify
          # The link is timestamp-free, so with THIS compiler the binary is
          # reproducible byte for byte. Record the version, because a different
          # mingw produces a different binary from identical sources.
          x86_64-w64-mingw32-g++ --version | head -1
          sha256sum xll/road_running_age_grading.xll
          x86_64-w64-mingw32-objdump -f xll/road_running_age_grading.xll | head -3
          strings xll/road_running_age_grading.xll | grep -c '^RRAG\.' | xargs -I{} test {} -eq 12

      - name: Package the Excel bundle
        run: |
          set -euo pipefail
          python -m pip install --quiet "openpyxl>=3.1"
          # --check rebuilds it and fails if the committed copy is stale, so the
          # asset is known to match this commit rather than merely to exist.
          python xll/examples/build_sample_workbook.py --check
          version="${{ steps.version.outputs.version }}"
          mkdir -p assets
          python - "$version" <<'PY'
          import sys, zipfile
          version = sys.argv[1]
          target = f"assets/brrag-{version}-excel.zip"
          with zipfile.ZipFile(target, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              z.write("xll/road_running_age_grading.xll", "road_running_age_grading.xll")
              z.write("xll/examples/age-grading-sample.xlsx", "age-grading-sample.xlsx")
          with zipfile.ZipFile(target) as z:
              names = z.namelist()
              for i in z.infolist():
                  print(f"  {i.filename:32} {i.file_size:>9,} -> {i.compress_size:>8,}")
          assert names == ["road_running_age_grading.xll", "age-grading-sample.xlsx"], names
          PY
          ls -l dist/ assets/

      # Two artifacts on purpose: `dist` is exactly what twine may upload, and
      # gh-action-pypi-publish rejects anything else in it (a stray .zip is read
      # as an sdist: "Too many top-level members in sdist archive").
      - name: Upload the distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Upload the Excel bundle
        uses: actions/upload-artifact@v7
        with:
          name: assets
          path: assets/
          if-no-files-found: error

  github-release:
    name: publish the GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: assets
          path: assets

      - name: Checksums
        run: |
          set -euo pipefail
          # Named explicitly: `sha256sum *` would include the file being written.
          sha256sum dist/* assets/* > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::a release for $GITHUB_REF_NAME already exists - bump the version instead of reusing a tag"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* assets/* SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
          gh release view "$GITHUB_REF_NAME" --json url,assets \
            --jq '.url, (.assets[] | "  " + .name + " " + (.size|tostring) + " B")'

  pypi:
    name: publish to PyPI
    needs: build
    # Trusted publishing: no token, no secret - PyPI verifies this workflow's
    # OIDC identity instead. Set the repository variable PYPI_ENABLED=true once
    # the pending publisher exists on pypi.org; see docs/11-releasing.md.
    if: github.ref_type == 'tag' && vars.PYPI_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/brrag
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1.14.3

      - name: Prove it landed
        run: |
          set -euo pipefail
          version="${{ needs.build.outputs.version }}"
          for _ in $(seq 1 12); do
            if curl -fsS "https://pypi.org/pypi/brrag/${version}/json" >/dev/null; then
              echo "brrag ${version} is on PyPI"
              curl -fsS "https://pypi.org/pypi/brrag/${version}/json" \
                | python -c 'import json,sys; d=json.load(sys.stdin); print("\n".join("  "+u["filename"] for u in d["urls"]))'
              exit 0
            fi
            sleep 5
          done
          echo "::error::PyPI does not list brrag ${version} yet"
          exit 1
